services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      # DATABASE_URL pointe vers le conteneur PostgreSQL "db" au sein du reseau Docker
      DATABASE_URL: ${DATABASE_URL:-postgresql://dashboard:dashboard@db:5432/dashboard}
      PORT: ${PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-epitech-2026}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      CLIENT_BASE_URL: ${CLIENT_BASE_URL:-http://localhost:8081}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
    depends_on:
      - server

volumes:
  db-data: