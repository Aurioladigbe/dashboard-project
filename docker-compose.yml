services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://dashboard:dashboard@db:5432/dashboard
      JWT_SECRET: change-me-in-env
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - server

volumes:
  db-data:
