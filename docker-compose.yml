services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard
      POSTGRES_DB: dashboard
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 3s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    environment:
      # Seule DATABASE_URL doit rester forcee ici : a l'interieur du reseau Docker
      # le nom d'hote de la base est "db" (nom du service), alors que .env.example
      # met "localhost" pour un usage hors Docker (ex: Prisma Studio en local).
      # JWT_SECRET et PORT viennent desormais de server/.env via env_file, pour ne
      # pas ecraser silencieusement la valeur que chacun met dans son .env local.
      DATABASE_URL: postgresql://dashboard:dashboard@db:5432/dashboard
    volumes:
      - ./server/prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - server

volumes:
  db-data: